<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聯絡我們</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; }
        .form-container { border: 1px solid #ccc; padding: 20px; width: 300px; border-radius: 8px; }
        input[type="text"], input[type="email"], textarea { width: 100%; margin-bottom: 10px; padding: 5px; }
        input[type="submit"] { padding: 8px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        input[type="submit"]:hover { background-color: #45a049; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>聯絡我們表單</h2>
    <form method="POST" action="send_mail.php">
        <label>姓名：</label>
        <input type="text" name="name" required>

        <label>電話：</label>
        <input type="text" name="telephone" required>

        <label>電子郵件：</label>
        <input type="email" name="email" required>

        <label>留言內容：</label>
        <textarea name="message" rows="5" required></textarea>

        <input type="submit" value="送出留言">
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 數值計算器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover { background-color: #218838; }
        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }
        .normal { background-color: #d4edda; color: #155724; }
        .warning { background-color: #fff3cd; color: #856404; }
        .danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>BMI 計算器</h2>
    <div class="input-group">
        <label>身高 (cm)</label>
        <input type="number" id="height" placeholder="例如：175">
    </div>
    <div class="input-group">
        <label>體重 (kg)</label>
        <input type="number" id="weight" placeholder="例如：70">
    </div>
    <button onclick="calculateBMI()">開始計算</button>
    <div id="result"></div>
</div>

<script>
    function calculateBMI() {
        const height = document.getElementById('height').value / 100;
        const weight = document.getElementById('weight').value;
        const resultDiv = document.getElementById('result');

        if (height > 0 && weight > 0) {
            const bmi = (weight / (height * height)).toFixed(1);
            let message = '';
            let className = '';

            if (bmi < 18.5) {
                message = `您的 BMI 是 ${bmi} (體重過輕)`;
                className = 'warning';
            } else if (bmi < 24) {
                message = `您的 BMI 是 ${bmi} (理想體重)`;
                className = 'normal';
            } else {
                message = `您的 BMI 是 ${bmi} (過重/肥胖)`;
                className = 'danger';
            }

            resultDiv.innerHTML = message;
            resultDiv.className = className;
            resultDiv.style.display = 'block';
        } else {
            alert('請輸入正確的身高與體重！');
        }
    }
</script>

</body>
</html>
